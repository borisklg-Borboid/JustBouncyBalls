<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Just Bouncy Balls</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        
        #canvas {
            display: block;
            cursor: grab;
        }
        
        #canvas:active {
            cursor: grabbing;
        }
        
        #controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 18px;
        }
        
        #nameInputArea {
            position: absolute;
            top: 56px;
            left: 20px;
            z-index: 100;
            --player-dot-space: 34px;
            --player-score-space: 54px;
            background: rgba(0, 0, 0, 0.28);
            border: none;
            border-radius: 8px;
            padding: 10px;
            box-shadow: none;
            display: block !important;
            visibility: visible !important;
            min-width: 220px;
            max-height: calc(100vh - 70px);
            overflow-y: auto;
        }
        
        .btn {
            background: linear-gradient(45deg, #ff0080, #00ff80);
            border: none;
            color: white;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.5);
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 0, 128, 0.8);
        }
        
        .ball-btn {
            position: relative;
            width: 74px;
            height: 74px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            overflow: hidden;
            color: white;
            font-size: 13px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 10px currentColor;
            background: radial-gradient(circle at 38% 32%, #7dff7d 0 16%, #00ff00 42%, #007a00 78%, #001400 100%);
            box-shadow:
                0 0 16px #00ff00,
                0 0 32px rgba(0, 255, 0, 0.65),
                inset -12px -14px 18px rgba(0, 0, 0, 0.55);
            transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
        }

        .ball-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.08);
            box-shadow:
                0 0 20px #00ff00,
                0 0 46px rgba(0, 255, 0, 0.85),
                inset -12px -14px 18px rgba(0, 0, 0, 0.55);
        }

        .ball-btn:disabled {
            opacity: 0.58;
            cursor: not-allowed;
        }

        #resetBtn.ball-btn {
            background: radial-gradient(circle at 38% 32%, #7dffd8 0 16%, #00ff9d 42%, #007a4b 78%, #00140c 100%);
            box-shadow:
                0 0 16px #00ff9d,
                0 0 32px rgba(0, 255, 157, 0.65),
                inset -12px -14px 18px rgba(0, 0, 0, 0.55);
        }

        #resetBtn.ball-btn:hover:not(:disabled) {
            box-shadow:
                0 0 20px #00ff9d,
                0 0 46px rgba(0, 255, 157, 0.85),
                inset -12px -14px 18px rgba(0, 0, 0, 0.55);
        }

        #info {
            position: absolute;
            top: 80px;
            left: 20px;
            color: #00ff80;
            font-size: 14px;
            text-shadow: 0 0 10px #00ff80;
            max-width: 400px;
        }
        
        #ballCount {
            position: absolute;
            top: 18px;
            left: 24px;
            right: auto;
            z-index: 101;
            color: #00ffff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffff;
        }

        #musicPlayer {
            position: absolute;
            top: 42px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 6px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.32);
            opacity: 0.72;
            transition: opacity 0.18s ease;
        }

        #totalPlays {
            position: absolute;
            top: 16px;
            right: 24px;
            z-index: 101;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-align: right;
            text-shadow: 0 0 8px #00ffff;
            opacity: 0.78;
            pointer-events: none;
        }

        #musicPlayer:hover {
            opacity: 1;
        }

        .music-btn {
            width: 22px;
            height: 22px;
            padding: 0;
            border: 1px solid #00ffff;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.08);
            color: #00ffff;
            font-size: 10px;
            font-weight: 900;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.34);
        }

        .music-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.72);
        }

        #musicTitleWindow {
            width: 118px;
            overflow: hidden;
            white-space: nowrap;
            color: #cfffff;
            font-family: 'Courier New', monospace;
            font-size: 10.5px;
            font-weight: 700;
            text-shadow: 0 0 8px #00ffff;
        }

        #musicTitle {
            display: inline-block;
            min-width: 100%;
            padding-left: 14px;
            padding-right: 24px;
            animation: music-title-scroll 10s linear infinite;
        }

        @keyframes music-title-scroll {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }
        

        
        .color-row {
            display: flex;
            align-items: center;
            margin: 8px 0;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        
        .color-box {
            width: 20px;
            height: 20px;
            padding: 0;
            border-radius: 50%;
            border: 2px solid white;
            background: currentColor;
            box-shadow: 0 0 10px currentColor;
            cursor: pointer;
            flex: 0 0 auto;
            transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease;
        }

        .color-box:hover:not(:disabled) {
            transform: scale(1.18);
            box-shadow: 0 0 12px currentColor, 0 0 24px currentColor;
        }

        .color-box:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }
        
        .color-count {
            min-width: 30px;
            padding: 4px 7px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-align: center;
            font-weight: bold;
        }
        
        .name-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #666;
            border-radius: 5px;
            padding: 5px 8px;
            color: white;
            font-size: 12px;
            max-width: 110px;
        }
        
        .name-input:focus {
            outline: none;
            border-color: #00ff80;
            box-shadow: 0 0 5px rgba(0, 255, 128, 0.5);
        }
        

        
        #playerControls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-sizing: border-box;
            width: 100%;
            padding-left: var(--player-dot-space);
            padding-right: var(--player-score-space);
            margin: 12px auto 0;
        }

        .player-count-btn {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 2px solid #00ff80;
            border-radius: 50%;
            background: rgba(0, 255, 128, 0.12);
            color: #00ff80;
            font-size: 0;
            line-height: 0;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 255, 128, 0.45);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .player-count-btn::before {
            display: block;
            font-size: 28px;
            font-weight: 900;
            line-height: 1;
            transform: translateY(-1px);
        }

        #removePlayerBtn::before {
            content: '−';
            font-size: 32px;
            transform: translateY(-2px);
        }

        #addPlayerBtn::before {
            content: '+';
        }

        #removePlayerBtn {
            border-color: #ff0080;
            background: rgba(255, 0, 128, 0.12);
            color: #ff0080;
            box-shadow: 0 0 12px rgba(255, 0, 128, 0.45);
        }

        .player-count-btn:hover:not(:disabled) {
            transform: scale(1.12);
        }

        .player-count-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        #winnerOverlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(4px);
        }

        #winnerOverlay.visible {
            display: flex;
        }

        #tieBattleOverlay {
            position: fixed;
            inset: 0;
            z-index: 950;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.74);
            backdrop-filter: blur(3px);
        }

        #tieBattleOverlay.visible {
            display: flex;
        }

        .tie-battle-card {
            width: min(820px, 82vw);
            padding: 28px 34px 32px;
            border: 4px solid white;
            border-radius: 28px;
            background: rgba(0, 0, 0, 0.84);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.35), inset 0 0 30px rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        .tie-battle-label {
            color: white;
            font-size: clamp(1.8rem, 4vw, 3.4rem);
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 0 18px white;
        }

        #tieBattleCanvas {
            display: block;
            width: 100%;
            aspect-ratio: 12 / 7;
            margin-top: 20px;
            border-radius: 20px;
            background: #020202;
        }

        #tieBattleNames {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
        }

        .tie-battle-chip {
            color: var(--chip-color);
            border: 2px solid var(--chip-color);
            border-radius: 999px;
            padding: 7px 12px;
            font-weight: 800;
            text-shadow: 0 0 10px var(--chip-color);
            box-shadow: 0 0 12px color-mix(in srgb, var(--chip-color), transparent 35%);
        }

        .winner-card {
            position: relative;
            z-index: 2;
            min-width: min(680px, 78vw);
            padding: 42px 60px;
            border: 4px solid var(--winner-color, #ffd700);
            border-radius: 32px;
            background: rgba(0, 0, 0, 0.82);
            box-shadow: 0 0 35px var(--winner-color, #ffd700), inset 0 0 35px rgba(255, 255, 255, 0.08);
            text-align: center;
            animation: winner-pop 0.7s cubic-bezier(.2, 1.6, .4, 1);
        }

        .winner-label {
            color: white;
            font-size: clamp(2.2rem, 6vw, 5rem);
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        #winnerName {
            margin-top: 12px;
            color: var(--winner-color, #ffd700);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: clamp(3rem, 9vw, 8rem);
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 0 18px var(--winner-color, #ffd700), 0 0 45px var(--winner-color, #ffd700);
        }

        #winnerScore {
            margin-top: 22px;
            color: white;
            font-size: clamp(1rem, 2vw, 1.5rem);
        }

        #winnerResetBtn {
            margin-top: 28px;
            width: 86px;
            height: 86px;
            font-size: 14px;
            background: radial-gradient(circle at 38% 32%, var(--winner-color, #ffd700) 0 42%, rgba(0, 0, 0, 0.62) 100%);
            box-shadow:
                0 0 16px var(--winner-color, #ffd700),
                0 0 36px var(--winner-color, #ffd700),
                inset -14px -16px 20px rgba(0, 0, 0, 0.55);
        }

        #winnerConfetti {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #finaleBlast {
            position: fixed;
            inset: 0;
            z-index: 120;
            pointer-events: none;
            opacity: 0;
            background:
                radial-gradient(circle at center, rgba(255, 255, 255, 0.72) 0 3%, rgba(0, 255, 255, 0.42) 4% 10%, rgba(255, 0, 128, 0.25) 11% 19%, transparent 34%),
                radial-gradient(circle at center, transparent 0 18%, rgba(255, 255, 255, 0.34) 20%, rgba(0, 255, 0, 0.22) 24%, transparent 42%);
            mix-blend-mode: screen;
            transform: scale(0.22);
        }

        #finaleBlast.active {
            animation: finale-blast-pop 0.62s cubic-bezier(.08, .95, .22, 1) forwards;
        }

        .confetti-ball {
            position: absolute;
            top: -10vh;
            left: var(--x);
            width: var(--size);
            height: var(--size);
            border-radius: 50%;
            background: var(--color);
            box-shadow: 0 0 10px var(--color), 0 0 24px var(--color);
            animation: ball-confetti var(--duration) linear var(--delay) infinite;
        }

        @keyframes winner-pop {
            from { opacity: 0; transform: scale(0.35) rotate(-4deg); }
            to { opacity: 1; transform: scale(1) rotate(0); }
        }

        @keyframes ball-confetti {
            0% { transform: translate3d(0, -12vh, 0) scale(0.5); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translate3d(var(--drift), 125vh, 0) scale(1.15); opacity: 0.85; }
        }

        @keyframes finale-blast-pop {
            0% { opacity: 0; transform: scale(0.18); filter: blur(8px); }
            12% { opacity: 1; }
            100% { opacity: 0; transform: scale(2.8); filter: blur(0); }
        }

        body.finale-shake #canvas {
            animation: finale-screen-shake 0.38s linear;
        }

        @keyframes finale-screen-shake {
            0%, 100% { transform: translate(0, 0); }
            15% { transform: translate(-5px, 3px); }
            30% { transform: translate(6px, -4px); }
            45% { transform: translate(-4px, -2px); }
            60% { transform: translate(4px, 3px); }
            75% { transform: translate(-2px, 2px); }
        }
        
        #title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 4rem;
            font-weight: bold;
            color: #ff0080;
            text-shadow: 
                0 0 20px #ff0080,
                0 0 40px #ff0080,
                0 0 60px #ff0080;
            animation: bounce 2s ease-in-out infinite;
            pointer-events: none;
            z-index: 50;
            letter-spacing: 3px;
            text-align: center;
            white-space: nowrap;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translate(-50%, -50%) translateY(0);
            }
            40% {
                transform: translate(-50%, -50%) translateY(-20px);
            }
            60% {
                transform: translate(-50%, -50%) translateY(-10px);
            }
        }
        
        #developer-credit {
            position: absolute;
            bottom: 64px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 0.8rem;
            color: rgba(210, 210, 210, 0.74);
            text-align: center;
            pointer-events: none;
            z-index: 80;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.95), 0 0 10px rgba(0, 255, 255, 0.22);
        }

        #rotateDeviceOverlay {
            position: fixed;
            inset: 0;
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 28px;
            background: radial-gradient(circle at center, rgba(0, 255, 128, 0.16), rgba(0, 0, 0, 0.96) 58%);
            color: white;
            text-align: center;
        }

        .rotate-card {
            max-width: 360px;
            padding: 28px 30px;
            border: 2px solid #00ffff;
            border-radius: 28px;
            background: rgba(0, 0, 0, 0.72);
            box-shadow: 0 0 24px rgba(0, 255, 255, 0.68), inset 0 0 24px rgba(0, 255, 255, 0.08);
        }

        .rotate-icon {
            font-size: 4rem;
            line-height: 1;
            text-shadow: 0 0 18px #00ffff;
            animation: rotate-hint 1.8s ease-in-out infinite;
        }

        .rotate-title {
            margin-top: 14px;
            color: #00ffff;
            font-size: 1.55rem;
            font-weight: 900;
            text-shadow: 0 0 12px #00ffff;
        }

        .rotate-copy {
            margin-top: 10px;
            color: #d6ffff;
            font-size: 1rem;
            line-height: 1.35;
        }

        @keyframes rotate-hint {
            0%, 100% { transform: rotate(-8deg) scale(1); }
            50% { transform: rotate(8deg) scale(1.08); }
        }

        @media (pointer: coarse), (max-width: 900px), (max-height: 520px) {
            #controls {
                top: max(8px, env(safe-area-inset-top));
                gap: 10px;
            }

            .ball-btn {
                width: 56px;
                height: 56px;
                font-size: 11px;
                box-shadow:
                    0 0 12px #00ff00,
                    0 0 26px rgba(0, 255, 0, 0.62),
                    inset -9px -11px 14px rgba(0, 0, 0, 0.55);
            }

            #winnerResetBtn {
                width: 68px;
                height: 68px;
                font-size: 12px;
            }

            #ballCount {
                top: max(8px, env(safe-area-inset-top));
                left: max(10px, env(safe-area-inset-left));
                font-size: 14px;
            }

            #nameInputArea {
                top: calc(max(8px, env(safe-area-inset-top)) + 34px);
                left: max(8px, env(safe-area-inset-left));
                --player-dot-space: 24px;
                --player-score-space: 42px;
                min-width: 0;
                width: 190px;
                max-height: calc(100dvh - 54px);
                padding: 6px;
                border-radius: 7px;
                background: rgba(0, 0, 0, 0.2);
            }

            .color-row {
                gap: 6px;
                margin: 5px 0;
            }

            .color-box {
                width: 16px;
                height: 16px;
                border-width: 2px;
            }

            .name-input {
                max-width: 86px;
                padding: 4px 6px;
                font-size: 11px;
            }

            .color-count {
                min-width: 24px;
                padding: 3px 6px;
                font-size: 12px;
            }

            #playerControls {
                gap: 8px;
                margin-top: 8px;
            }

            .player-count-btn {
                width: 31px;
                height: 31px;
            }

            .player-count-btn::before {
                font-size: 24px;
            }

            #removePlayerBtn::before {
                font-size: 29px;
            }

            #totalPlays {
                top: max(7px, env(safe-area-inset-top));
                right: max(10px, env(safe-area-inset-right));
                font-size: 9.5px;
            }

            #musicPlayer {
                top: calc(max(7px, env(safe-area-inset-top)) + 22px);
                right: max(8px, env(safe-area-inset-right));
                gap: 4px;
                padding: 4px 5px;
            }

            .music-btn {
                width: 20px;
                height: 20px;
                font-size: 9px;
            }

            #musicTitleWindow {
                width: 82px;
                font-size: 9px;
            }

            #title {
                font-size: clamp(2rem, 8vw, 3.1rem);
                letter-spacing: 1px;
            }

            #developer-credit {
                bottom: max(38px, calc(env(safe-area-inset-bottom) + 28px));
                font-size: 0.62rem;
            }

            .winner-card {
                min-width: min(520px, 82vw);
                padding: 28px 34px;
                border-radius: 26px;
            }

            #winnerName {
                font-size: clamp(2.6rem, 10vw, 5rem);
            }

            .tie-battle-card {
                width: min(720px, 88vw);
                padding: 18px 22px 22px;
            }
        }

        body.mobile-device.mobile-portrait #rotateDeviceOverlay {
            display: flex;
        }

        body.mobile-device.mobile-portrait #canvas,
        body.mobile-device.mobile-portrait #controls,
        body.mobile-device.mobile-portrait #nameInputArea,
        body.mobile-device.mobile-portrait #title,
        body.mobile-device.mobile-portrait #ballCount,
        body.mobile-device.mobile-portrait #totalPlays,
        body.mobile-device.mobile-portrait #musicPlayer,
        body.mobile-device.mobile-portrait #developer-credit {
            filter: blur(5px);
            opacity: 0.34;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="startBtn" class="btn ball-btn">Start</button>
        <button id="resetBtn" class="btn ball-btn">Reset</button>
    </div>
    
    <div id="nameInputArea">
        <div id="colorList"></div>
        <div id="playerControls">
            <button id="removePlayerBtn" class="player-count-btn" type="button" aria-label="Remove player" title="Remove player">-</button>
            <button id="addPlayerBtn" class="player-count-btn" type="button" aria-label="Add player" title="Add player">+</button>
        </div>
    </div>

    <div id="title">Just Bouncy Balls</div>
    <div id="finaleBlast" aria-hidden="true"></div>
    <div id="ballCount">Balls: <span id="count">1</span></div>
    <div id="totalPlays">Total plays: <span id="totalPlaysCount">...</span></div>
    <div id="musicPlayer" aria-label="Playlist controls">
        <button id="prevTrackBtn" class="music-btn" type="button" aria-label="Previous track"><<</button>
        <div id="musicTitleWindow" aria-live="polite">
            <span id="musicTitle">Bounce Bit Blast</span>
        </div>
        <button id="nextTrackBtn" class="music-btn" type="button" aria-label="Next track">>></button>
    </div>
    
    <div id="developer-credit">© BorBoid 2026</div>
    <div id="rotateDeviceOverlay" aria-live="polite">
        <div class="rotate-card">
            <div class="rotate-icon">↻</div>
            <div class="rotate-title">Turn sideways</div>
            <div class="rotate-copy">Just Bouncy Balls plays best in landscape. Rotate your device for the full game view.</div>
        </div>
    </div>
    
    <canvas id="canvas"></canvas>
    <audio id="backgroundMusic" preload="auto"></audio>

    <div id="tieBattleOverlay" aria-hidden="true">
        <div class="tie-battle-card">
            <div class="tie-battle-label">Tie Battle</div>
            <canvas id="tieBattleCanvas" width="720" height="420"></canvas>
            <div id="tieBattleNames"></div>
        </div>
    </div>

    <div id="winnerOverlay" role="dialog" aria-modal="true" aria-labelledby="winnerName" aria-hidden="true">
        <div id="winnerConfetti"></div>
        <div class="winner-card">

            isAtRest() {

            isWithinFinaleBottomZone() {

                const topOfBall = this.y - this.radius;

            }
            
            checkTitleCollision() {
                // Get title position
                const titleCenterX = canvas.width / 2;
                const titleCenterY = canvas.height / 2;
                
                // Define letter collision boxes with better boundaries
                const fontSize = 64; // 4rem converted to pixels
                const letterSpacing = 3;
                const letterWidth = fontSize * 0.5; // Slightly wider for better detection
                const letterHeight = fontSize * 0.85; // Slightly taller for better detection
                
                // Calculate starting position for the text
                const text = "Just Bouncy Balls";
                const totalTextWidth = (text.length * letterWidth) + ((text.length - 1) * letterSpacing);
                const startX = titleCenterX - totalTextWidth / 2;
                const startY = titleCenterY - letterHeight / 2;
                
                let currentX = startX;
                
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    
                    // Skip spaces - allow balls to fall through
                    if (char === ' ') {
                        currentX += letterWidth * 0.6; // Space width
                        continue;
                    }
                    
                    // Define letter collision box with expanded detection area
                    const letterLeft = currentX + letterWidth * 0.05; // Smaller margin for better detection
                    const letterRight = currentX + letterWidth * 0.95; // Smaller margin for better detection
                    const letterTop = startY + letterHeight * 0.05; // Smaller margin for better detection
                    const letterBottom = startY + letterHeight * 0.95; // Smaller margin for better detection
                    
                    // Get ball position and radius
                    const ballCenterX = this.x;
                    const ballCenterY = this.y;
                    const ballRadius = this.radius;
                    
                    // Expanded collision detection - check both current and next position
                    const nextX = ballCenterX + this.vx;
                    const nextY = ballCenterY + this.vy;
                    
                    // Check collision with current position
                    let collision = this.checkRectangleCollision(ballCenterX, ballCenterY, ballRadius, letterLeft, letterRight, letterTop, letterBottom);
                    
                    // Also check collision with next position to catch fast-moving balls
                    if (!collision) {
                        collision = this.checkRectangleCollision(nextX, nextY, ballRadius, letterLeft, letterRight, letterTop, letterBottom);
                    }
                    
                    // Additional check: see if ball path intersects with letter rectangle
                    if (!collision) {
                        collision = this.checkLineRectangleIntersection(ballCenterX, ballCenterY, nextX, nextY, ballRadius, letterLeft, letterRight, letterTop, letterBottom);
                    }
                    
                    if (collision) {
                        // Collision detected!
                        
                        // Change letter color to ball color
                        letterColors[i] = this.color;
                        updateTitleColor();
                        playPopcornPop();
                        
                        // Determine collision direction based on ball position relative to letter center
                        const letterCenterX = (letterLeft + letterRight) / 2;
                        const letterCenterY = (letterTop + letterBottom) / 2;
                        
                        const deltaX = ballCenterX - letterCenterX;
                        const deltaY = ballCenterY - letterCenterY;
                        
                        // Determine which side of the letter was hit with improved logic
                        const absX = Math.abs(deltaX);
                        const absY = Math.abs(deltaY);
                        
                        // Calculate overlap on each side to determine best bounce direction
                        const overlapLeft = (ballCenterX + ballRadius) - letterLeft;
                        const overlapRight = letterRight - (ballCenterX - ballRadius);
                        const overlapTop = (ballCenterY + ballRadius) - letterTop;
                        const overlapBottom = letterBottom - (ballCenterY - ballRadius);
                        
                        // Find the side with minimum overlap (most likely collision side)
                        const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
                        
                        if (minOverlap === overlapLeft) {
                            // Hit left side of letter
                            this.x = letterLeft - ballRadius - 3;
                            this.vx = -Math.abs(this.vx) * 1.4 - 2;
                        } else if (minOverlap === overlapRight) {
                            // Hit right side of letter
                            this.x = letterRight + ballRadius + 3;
                            this.vx = Math.abs(this.vx) * 1.4 + 2;
                        } else if (minOverlap === overlapTop) {
                            // Hit top of letter
                            this.y = letterTop - ballRadius - 3;
                            this.vy = -Math.abs(this.vy) * 1.4 - 2;
                        } else {
                            // Hit bottom of letter
                            this.y = letterBottom + ballRadius + 3;
                            this.vy = Math.abs(this.vy) * 1.4 + 2;
                        }
                        
                        // Add more randomness and energy to prevent getting stuck
                        this.vx += (Math.random() - 0.5) * 3;
                        this.vy += (Math.random() - 0.5) * 3;
                        
                        // Ensure minimum velocity to prevent sticking
                        if (Math.abs(this.vx) < 1) this.vx = (this.vx >= 0 ? 1 : -1);
                        if (Math.abs(this.vy) < 1) this.vy = (this.vy >= 0 ? 1 : -1);
                        
                        return; // Exit after first collision
                    }
                    
                    currentX += letterWidth + letterSpacing;
                }
            }
            
            // Helper function to check if a circle collides with a rectangle
            checkRectangleCollision(circleX, circleY, radius, rectLeft, rectRight, rectTop, rectBottom) {
                // Find the closest point on the rectangle to the circle center
                const closestX = Math.max(rectLeft, Math.min(circleX, rectRight));
                const closestY = Math.max(rectTop, Math.min(circleY, rectBottom));
                
                // Calculate distance from circle center to closest point
                const distanceX = circleX - closestX;
                const distanceY = circleY - closestY;
                const distanceSquared = (distanceX * distanceX) + (distanceY * distanceY);
                
                return distanceSquared < (radius * radius);
            }
            
            // Helper function to check if a moving circle intersects with a rectangle
            checkLineRectangleIntersection(x1, y1, x2, y2, radius, rectLeft, rectRight, rectTop, rectBottom) {
                // Expand rectangle by radius to account for circle size
                const expandedLeft = rectLeft - radius;
                const expandedRight = rectRight + radius;
                const expandedTop = rectTop - radius;
                const expandedBottom = rectBottom + radius;
                
                // Check if line segment intersects with expanded rectangle
                return this.lineIntersectsRect(x1, y1, x2, y2, expandedLeft, expandedRight, expandedTop, expandedBottom);
            }
            
            // Helper function to check if a line segment intersects with a rectangle
            lineIntersectsRect(x1, y1, x2, y2, rectLeft, rectRight, rectTop, rectBottom) {
                // Check if either endpoint is inside the rectangle
                if ((x1 >= rectLeft && x1 <= rectRight && y1 >= rectTop && y1 <= rectBottom) ||
                    (x2 >= rectLeft && x2 <= rectRight && y2 >= rectTop && y2 <= rectBottom)) {
                    return true;
                }
                
                // Check if line intersects any of the rectangle edges
                return this.lineIntersectsLine(x1, y1, x2, y2, rectLeft, rectTop, rectRight, rectTop) ||    // Top edge
                       this.lineIntersectsLine(x1, y1, x2, y2, rectRight, rectTop, rectRight, rectBottom) || // Right edge
                       this.lineIntersectsLine(x1, y1, x2, y2, rectRight, rectBottom, rectLeft, rectBottom) || // Bottom edge
                       this.lineIntersectsLine(x1, y1, x2, y2, rectLeft, rectBottom, rectLeft, rectTop);    // Left edge
            }
            
            // Helper function to check if two line segments intersect
            lineIntersectsLine(x1, y1, x2, y2, x3, y3, x4, y4) {
                const denom = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
                if (Math.abs(denom) < 0.0001) return false; // Lines are parallel
                
                const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / denom;
                const u = -((x1 - x2) * (y1 - y3) - (y1 - y2) * (x1 - x3)) / denom;
                
                return t >= 0 && t <= 1 && u >= 0 && u <= 1;
            }
            
            draw() {
                // Simplified drawing for better performance with many balls
                if (balls.length > 500) {
                    // Simple solid circles when there are many balls
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Full neon effect when there are fewer balls
                    // Neon glow effect
                    const gradient = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, this.radius * 2
                    );
                    gradient.addColorStop(0, this.color);
                    gradient.addColorStop(0.7, this.color + '80');
                    gradient.addColorStop(1, this.color + '00');
                    
                    // Outer glow
                    ctx.save();
                    ctx.globalCompositeOperation = 'screen';
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    
                    // Main ball
                    ctx.save();
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 20 * this.glowIntensity;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Inner highlight
                    const highlightGradient = ctx.createRadialGradient(
                        this.x - this.radius * 0.3, this.y - this.radius * 0.3, 0,
                        this.x, this.y, this.radius
                    );
                    highlightGradient.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
                    highlightGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = highlightGradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
            
            isPointInside(x, y) {
                const dx = x - this.x;
                const dy = y - this.y;
                return dx * dx + dy * dy <= this.radius * this.radius;
            }
            
            shrink() {
                this.radius = Math.max(this.radius * 0.5, this.minRadius);
            }
        }

        function cyclePlayerColor(index) {
            if (gameStarted && !gameEnded) return;

            const currentColor = selectedPlayerColors[index];
            const availableColors = getUnusedColors(index);
            if (availableColors.length <= 1) return;

            const currentPaletteIndex = neonColors.indexOf(currentColor);
            const nextColor = neonColors

            const currentName = playerNames[currentColor] || '';

            if (shouldPlay) {
