            boostLayer.innerHTML = '';
            boostLayer.appendChild(target);
            activeBoost.element = target;
            activeBoost.missListener = event => {
                if (event.target && event.target.closest && event.target.closest('.boost-target')) return;
                completeBoostMiss();
            };
            document.addEventListener('pointerdown', activeBoost.missListener, true);
            activeBoost.targetTimer = setTimeout(completeBoostMiss, BOOST_TARGET_MS);
            renderPlayerList();
        }

        function completeBoostSuccess() {
            if (!activeBoost || activeBoost.phase !== 'target') return;

            clearTimeout(activeBoost.targetTimer);
            const boost = activeBoost;
            boost.phase = 'success';
            if (boost.element) {
                boost.element.classList.add('success');
                boost.element.disabled = true;
            }
            showBoostFeedback('+10', boost.x, boost.y, boost.color);
            playBoostSuccessSound(boost.color);
            spawnBoostBalls(boost);
            setTimeout(() => finishBoostAttempt(boost), 760);
        }

        function completeBoostMiss() {
            if (!activeBoost || activeBoost.phase !== 'target') return;

            const boost = activeBoost;
            boost.phase = 'miss';
            if (boost.element) {
                boost.element.textContent = 'Too late';
                boost.element.classList.add('miss');
                boost.element.disabled = true;
            }
            setTimeout(() => finishBoostAttempt(boost), 620);
        }

        function finishBoostAttempt(boost = activeBoost) {
            if (!boost || boost !== activeBoost) return;

            clearTimeout(boost.waitTimer);
            clearTimeout(boost.targetTimer);
            if (boost.missListener) document.removeEventListener('pointerdown', boost.missListener, true);
            activeBoost = null;
            boostLayer.innerHTML = '';
            renderPlayerList();
            offerNextBoost();
        }

        function showBoostFeedback(text, x, y, color) {
            const feedback = document.createElement('div');
            feedback.className = 'boost-feedback';
            feedback.textContent = text;
            feedback.style.setProperty('--boost-color', color);
            feedback.style.setProperty('--boost-x', `${x}px`);
            feedback.style.setProperty('--boost-y', `${y}px`);
            boostLayer.appendChild(feedback);
            setTimeout(() => feedback.remove(), 950);
        }

        function spawnBoostBalls(boost) {
            const spawnY = Math.max(46, titleZone ? titleZone.baseTop - 70 : canvas.height * 0.42);
            const centerX = titleZone ? (titleZone.left + titleZone.right) / 2 : canvas.width / 2;

            for (let i = 0; i < BOOST_BALL_COUNT && balls.length < getMaxBalls(); i++) {
                const spread = (i - (BOOST_BALL_COUNT - 1) / 2) * 7;
                const ball = new Ball(centerX + spread, spawnY - (i % 2) * 12, Math.random() * 5 + 5, boost.color);
                ball.vx = (Math.random() - 0.5) * 3.4;
                ball.vy = Math.random() * 2.5 + 0.8;
                ball.glowIntensity = 1.8;
                balls.push(ball);
            }
            updateBallCount();
        }
        
        function updatePlayerName(color, name) {
            playerNames[color] = name.trim();
        }

        function addPlayer() {
            if (activePlayerCount >= getMaxPlayers() || (gameStarted && !gameEnded)) return;
            const usedColors = getActiveColors();
            const nextColor = neonColors.find(color => !usedColors.includes(color));
            selectedPlayerColors[activePlayerCount] = nextColor || neonColors[activePlayerCount];
            activePlayerCount++;
            renderPlayerList();
        }

        function removePlayer() {
            if (activePlayerCount <= MIN_PLAYERS || (gameStarted && !gameEnded)) return;
            activePlayerCount--;
            renderPlayerList();
        }

        function cyclePlayerColor(index) {
            if (gameStarted && !gameEnded) return;

            const currentColor = selectedPlayerColors[index];
            const availableColors = getUnusedColors(index);
            if (availableColors.length <= 1) return;

            const currentPaletteIndex = neonColors.indexOf(currentColor);
            const nextColor = neonColors
                .slice(currentPaletteIndex + 1)
                .concat(neonColors.slice(0, currentPaletteIndex + 1))
                .find(color => availableColors.includes(color) && color !== currentColor);

            if (!nextColor) return;

            const currentName = playerNames[currentColor] || '';
            selectedPlayerColors[index] = nextColor;
            playerNames[nextColor] = currentName;
            delete playerNames[currentColor];
            renderPlayerList();
        }

        function ensureAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;

            if (AudioContext && !audioCtx) {
                audioCtx = new AudioContext();
                popNoiseBuffer = createPopNoiseBuffer(audioCtx);
                swooshNoiseBuffer = createSwooshNoiseBuffer(audioCtx);
            }

            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function startBackgroundMusic() {
            if (!backgroundMusic || musicPlaylist.length === 0) return;
            if (musicStarted && !backgroundMusic.paused) return;

            backgroundMusic.autoplay = true;
            backgroundMusic.muted = false;
            backgroundMusic.playsInline = true;
            backgroundMusic.volume = MUSIC_BASE_VOLUME;
            backgroundMusic.loop = false;
            if (!backgroundMusic.src) {
                setBackgroundTrack(currentMusicTrackIndex, false);
            }

            backgroundMusic.play()
                .then(() => {
                    musicStarted = true;
                })
                .catch(() => {
                    musicStarted = false;
                });
        }

        function primeBackgroundMusic() {
            if (!backgroundMusic || musicPlaylist.length === 0) return;

            backgroundMusic.autoplay = true;
            backgroundMusic.muted = false;
            backgroundMusic.playsInline = true;

            if (!backgroundMusic.src) {
                setBackgroundTrack(currentMusicTrackIndex, false);
            }

            backgroundMusic.load();
            startBackgroundMusic();
        }

        function setBackgroundTrack(index, shouldPlay = musicStarted) {
            if (!backgroundMusic || musicPlaylist.length === 0) return;

            currentMusicTrackIndex = (index + musicPlaylist.length) % musicPlaylist.length;
            backgroundMusic.src = musicPlaylist[currentMusicTrackIndex];
            backgroundMusic.load();
            updateMusicTitle();

            if (shouldPlay) {
                musicStarted = false;
                startBackgroundMusic();
            }
        }

        function playNextBackgroundTrack() {
            if (!backgroundMusic || musicPlaylist.length === 0) return;

            setBackgroundTrack(currentMusicTrackIndex + 1, true);
        }

        function playPreviousBackgroundTrack() {
            if (!backgroundMusic || musicPlaylist.length === 0) return;

            setBackgroundTrack(currentMusicTrackIndex - 1, true);
        }

        function updateMusicTitle() {
            if (!musicTitle || musicPlaylist.length === 0) return;

            const trackPath = musicPlaylist[currentMusicTrackIndex];
            const trackName = decodeURIComponent(trackPath.split('/').pop()).replace(/\.[^.]+$/, '');
            musicTitle.textContent = `${trackName}   `;
        }

        function duckBackgroundMusic(progress) {
            if (!backgroundMusic) return;

            if (musicRestoreFrame) {
                cancelAnimationFrame(musicRestoreFrame);
                musicRestoreFrame = null;
            }

            const shapedProgress = Math.max(0, Math.min(1, progress * progress));
            backgroundMusic.volume = MUSIC_BASE_VOLUME - ((MUSIC_BASE_VOLUME - MUSIC_DUCKED_VOLUME) * shapedProgress);
        }

        function restoreBackgroundMusic(duration = 900) {
            if (!backgroundMusic) return;
            if (musicRestoreFrame) cancelAnimationFrame(musicRestoreFrame);

            const startVolume = backgroundMusic.volume;
            const startedAt = performance.now();

            function step(now) {
                const progress = Math.min(1, (now - startedAt) / duration);
                const ease = 1 - Math.pow(1 - progress, 3);
                backgroundMusic.volume = startVolume + ((MUSIC_BASE_VOLUME - startVolume) * ease);

                if (progress < 1) {
                    musicRestoreFrame = requestAnimationFrame(step);
                } else {
                    backgroundMusic.volume = MUSIC_BASE_VOLUME;
                    musicRestoreFrame = null;
                }
            }

            musicRestoreFrame = requestAnimationFrame(step);
        }

        function createPopNoiseBuffer(context) {
            const duration = 0.045;
            const sampleCount = Math.floor(context.sampleRate * duration);
            const buffer = context.createBuffer(1, sampleCount, context.sampleRate);
            const data = buffer.getChannelData(0);

            for (let i = 0; i < sampleCount; i++) {
                const envelope = 1 - i / sampleCount;
                data[i] = (Math.random() * 2 - 1) * envelope * envelope;
            }

            return buffer;
        }

        function createSwooshNoiseBuffer(context) {
            const duration = 1.2;
            const sampleCount = Math.floor(context.sampleRate * duration);
            const buffer = context.createBuffer(1, sampleCount, context.sampleRate);
            const data = buffer.getChannelData(0);
            let previous = 0;

            for (let i = 0; i < sampleCount; i++) {
                const white = Math.random() * 2 - 1;
                previous = previous * 0.62 + white * 0.38;
                data[i] = previous;
            }

            return buffer;
        }

        function getFinaleSwooshProgress() {
            const maxBalls = getMaxBalls();
            return Math.max(0, Math.min(1, (balls.length - SWOOSH_START_BALLS) / (maxBalls - SWOOSH_START_BALLS)));
        }

        function checkFinaleBlastCue() {
            if (!gameStarted || gameEnded || finaleBlastTriggered) return;

            if (balls.length >= Math.floor(getMaxBalls() * FINALE_BLAST_PROGRESS)) {
                finaleBlastTriggered = true;
                triggerFinaleBlast();
                startBoostOffers();
            }
        }

        function updateFinaleSwoosh() {
            if (!gameStarted || gameEnded || finaleSwooshFinished || balls.length < SWOOSH_START_BALLS) return;

            const context = ensureAudio();
            if (!context || !swooshNoiseBuffer) return;

            if (!finaleSwoosh) startFinaleSwoosh(context);

            const progress = getFinaleSwooshProgress();
            const now = context.currentTime;
            const curve = Math.pow(progress, 1.35);
            const bite = Math.pow(progress, 2.2);
            const volume = 0.0162 + curve * 0.414;
            const toneVolume = 0.0162 + bite * 0.063;
            const filterFrequency = 300 + curve * 9800;
            const highpassFrequency = 55 + progress * 1450;
            const toneFrequency = 90 + curve * 1520;

            duckBackgroundMusic(progress);

            finaleSwoosh.master.gain.cancelScheduledValues(now);
            finaleSwoosh.master.gain.linearRampToValueAtTime(volume, now + 0.035);
            finaleSwoosh.toneGain.gain.cancelScheduledValues(now);
            finaleSwoosh.toneGain.gain.linearRampToValueAtTime(toneVolume, now + 0.035);
            finaleSwoosh.filter.frequency.cancelScheduledValues(now);
            finaleSwoosh.filter.frequency.linearRampToValueAtTime(filterFrequency, now + 0.035);
            finaleSwoosh.highpass.frequency.cancelScheduledValues(now);
            finaleSwoosh.highpass.frequency.linearRampToValueAtTime(highpassFrequency, now + 0.035);
            finaleSwoosh.tone.frequency.cancelScheduledValues(now);
            finaleSwoosh.tone.frequency.linearRampToValueAtTime(toneFrequency, now + 0.035);

            if (balls.length >= getMaxBalls()) finishFinaleSwoosh();
        }

        function startFinaleSwoosh(context) {
            const now = context.currentTime;
            const noise = context.createBufferSource();
            const filter = context.createBiquadFilter();
            const highpass = context.createBiquadFilter();
            const tone = context.createOscillator();
            const toneGain = context.createGain();
            const master = context.createGain();
            const panner = context.createStereoPanner ? context.createStereoPanner() : null;

            noise.buffer = swooshNoiseBuffer;
            noise.loop = true;
            filter.type = 'bandpass';
            filter.frequency.value = 300;
            filter.Q.value = 1.45;
            highpass.type = 'highpass';
            highpass.frequency.value = 55;
            tone.type = 'sawtooth';
            tone.frequency.value = 90;
            toneGain.gain.value = 0.018;
            master.gain.value = 0.0001;

            noise.connect(highpass);
            highpass.connect(filter);
            filter.connect(master);
            tone.connect(toneGain);
            toneGain.connect(master);

            if (panner) {
                panner.pan.value = 0;
                master.connect(panner);
                panner.connect(context.destination);
            } else {
                master.connect(context.destination);
            }

            noise.start(now);
            tone.start(now);
            finaleSwoosh = { noise, filter, highpass, tone, toneGain, master };
        }

        function finishFinaleSwoosh() {
            if (finaleSwooshFinished) return;

            const context = ensureAudio();
            if (!context) return;

            finaleSwooshFinished = true;
            const now = context.currentTime;

            if (finaleSwoosh) {
                finaleSwoosh.master.gain.cancelScheduledValues(now);
                finaleSwoosh.master.gain.setValueAtTime(finaleSwoosh.master.gain.value, now);
                finaleSwoosh.master.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
                finaleSwoosh.toneGain.gain.cancelScheduledValues(now);
                finaleSwoosh.toneGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
                finaleSwoosh.tone.frequency.cancelScheduledValues(now);
                finaleSwoosh.tone.frequency.exponentialRampToValueAtTime(2200, now + 0.065);
                finaleSwoosh.noise.stop(now + 0.12);
                finaleSwoosh.tone.stop(now + 0.12);
                finaleSwoosh = null;
            }

            playFinaleBounceCascade(context, now);
            blastFinaleBalls();
            restoreBackgroundMusic(450);
        }

        function triggerFinaleBlast() {
            if (!finaleBlastElement) return;

            finaleBlastElement.classList.remove('active');
            document.body.classList.remove('finale-shake');
            void finaleBlastElement.offsetWidth;
            finaleBlastElement.classList.add('active');
            document.body.classList.add('finale-shake');

            setTimeout(() => {
                finaleBlastElement.classList.remove('active');
                document.body.classList.remove('finale-shake');
            }, 700);
        }

        function blastFinaleBalls() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const force = isMobileOrTablet() ? 1.15 : 2.35;

            balls.forEach(ball => {
                const dx = ball.x - centerX;
                const dy = ball.y - centerY;
                const distance = Math.max(80, Math.sqrt(dx * dx + dy * dy));
                const edgeBoost = 1 + Math.min(1.2, distance / Math.max(canvas.width, canvas.height));

                ball.vx += (dx / distance) * force * edgeBoost + (Math.random() - 0.5) * force;
                ball.vy += (dy / distance) * force * edgeBoost - force * 0.55 + (Math.random() - 0.5) * force;
                ball.glowIntensity = 2.2;
            });
        }

        function playFinaleBounceCascade(context, now) {
            const targetDuration = 4;
            const bounceCount = isMobileOrTablet() ? 38 : 58;
            let offset = 0;

            for (let i = 0; i < bounceCount; i++) {
                const progress = i / Math.max(1, bounceCount - 1);
                const eased = Math.pow(progress, 1.55);
                const pitch = 620 - eased * 500 + (Math.random() - 0.5) * (65 - progress * 30);
                const duration = 0.032 + progress * 0.09;
                const volume = (0.09 + (1 - progress) * 0.055) * (isMobileOrTablet() ? 0.72 : 1);
                const panValue = Math.max(-0.85, Math.min(0.85, (Math.random() - 0.5) * (1.1 - progress * 0.45)));

                scheduleFinaleBounce(context, now + offset, pitch, duration, volume, panValue);

                if (i < bounceCount - 1) {
                    const nextProgress = (i + 1) / Math.max(1, bounceCount - 1);
                    offset = Math.pow(nextProgress, 2.35) * targetDuration;
                }
            }
        }

        function scheduleFinaleBounce(context, startTime, pitch, duration, volume, panValue) {
            const noise = context.createBufferSource();
            const noiseFilter = context.createBiquadFilter();
            const noiseGain = context.createGain();
            const tone = context.createOscillator();
            const toneGain = context.createGain();
            const master = context.createGain();
            const panner = context.createStereoPanner ? context.createStereoPanner() : null;

            noise.buffer = popNoiseBuffer || swooshNoiseBuffer;
            noise.playbackRate.value = 0.85 + Math.random() * 0.9;
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.setValueAtTime(Math.max(180, pitch * 3.1), startTime);
            noiseFilter.frequency.exponentialRampToValueAtTime(Math.max(120, pitch * 1.1), startTime + duration);
            noiseFilter.Q.value = 7 + Math.random() * 4;

            tone.type = Math.random() < 0.5 ? 'triangle' : 'sine';
            tone.frequency.setValueAtTime(Math.max(80, pitch), startTime);
            tone.frequency.exponentialRampToValueAtTime(Math.max(55, pitch * 0.52), startTime + duration);

            noiseGain.gain.setValueAtTime(volume, startTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
            toneGain.gain.setValueAtTime(volume * 0.34, startTime);
            toneGain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration * 1.2);
            master.gain.value = 0.82;

            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            tone.connect(toneGain);
            noiseGain.connect(master);
            toneGain.connect(master);

            if (panner) {
                panner.pan.value = panValue;
                master.connect(panner);
                panner.connect(context.destination);
            } else {
                master.connect(context.destination);
            }

            noise.start(startTime);
            tone.start(startTime);
            noise.stop(startTime + duration);
            tone.stop(startTime + duration * 1.25);
        }

        function stopFinaleSwoosh() {
            if (!finaleSwoosh) return;

            const context = audioCtx;
            const now = context ? context.currentTime : 0;

            try {
                finaleSwoosh.noise.stop(now + 0.02);
                finaleSwoosh.tone.stop(now + 0.02);
            } catch (error) {
                // Already stopped.
            }

            finaleSwoosh = null;
            restoreBackgroundMusic(250);
        }
        
        function playPopcornPop(options = {}) {
            const context = ensureAudio();
            if (!context || !popNoiseBuffer) return;

            const mode = options.mode || 'letter';
            const intensity = options.intensity ?? 1;
            const skipThrottle = options.skipThrottle || false;
            const now = context.currentTime;
            const growth = Math.min(1, Math.log10(Math.max(2, balls.length)) / Math.log10(getMaxBalls()));
            const minGap = mode === 'letter'
                ? 0.045 - growth * 0.027
                : 0.13 - growth * 0.085;

            if (!skipThrottle) {
                if (mode === 'letter') {
                    if (now - lastLetterPopTime < minGap) return;
                    lastLetterPopTime = now;
                } else {
                    if (now - lastBattlePopTime < minGap) return;
                    lastBattlePopTime = now;
                }
            }

            const panValue = Math.max(-0.9, Math.min(0.9, (Math.random() - 0.5) * (0.5 + growth)));
            const variants = [
                { pitch: 155, filter: 520, q: 4.6, duration: 0.052, noiseRate: 0.72, wave: 'sine', toneMix: 0.38 },
                { pitch: 190, filter: 680, q: 5.5, duration: 0.045, noiseRate: 0.82, wave: 'triangle', toneMix: 0.34 },
                { pitch: 235, filter: 860, q: 7.0, duration: 0.036, noiseRate: 1.02, wave: 'sine', toneMix: 0.28 },
                { pitch: 260, filter: 980, q: 7.5, duration: 0.032, noiseRate: 1.12, wave: 'triangle', toneMix: 0.24 },
                { pitch: 310, filter: 1180, q: 8.4, duration: 0.030, noiseRate: 1.28, wave: 'square', toneMix: 0.14 },
                { pitch: 340, filter: 1350, q: 9.0, duration: 0.026, noiseRate: 1.42, wave: 'sine', toneMix: 0.22 },
                { pitch: 390, filter: 1550, q: 6.8, duration: 0.024, noiseRate: 1.56, wave: 'triangle', toneMix: 0.18 },
                { pitch: 430, filter: 1780, q: 6.0, duration: 0.022, noiseRate: 1.72, wave: 'sine', toneMix: 0.16 },
                { pitch: 520, filter: 2300, q: 5.2, duration: 0.019, noiseRate: 2.05, wave: 'square', toneMix: 0.08 }
            ];
            const variant = variants[Math.floor(Math.random() * variants.length)];
            const doublePop = mode === 'letter' && !skipThrottle && Math.random() < 0.18;
            const startOffset = doublePop ? Math.random() * 0.012 : 0;
            const pitch = (variant.pitch + Math.random() * 70 + growth * 120) * (0.94 + Math.random() * 0.14);
            const volume = Math.min(0.0902, 0.0352 + growth * 0.0418) * intensity;
            const duration = variant.duration + Math.random() * 0.012;

            const noise = context.createBufferSource();
            noise.buffer = popNoiseBuffer;
            noise.playbackRate.value = variant.noiseRate + Math.random() * 0.28;

            const filter = context.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = variant.filter + growth * 1300 + Math.random() * 420;
            filter.Q.value = variant.q + Math.random() * 2.2;

            const tone = context.createOscillator();
            tone.type = variant.wave;
            tone.frequency.setValueAtTime(pitch, now + startOffset);
            tone.frequency.exponentialRampToValueAtTime(Math.max(85, pitch * 0.52), now + startOffset + duration);

            const noiseGain = context.createGain();
            const toneGain = context.createGain();
            const master = context.createGain();
            const panner = context.createStereoPanner ? context.createStereoPanner() : null;

            noiseGain.gain.setValueAtTime(volume, now + startOffset);
            noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + startOffset + duration);
            toneGain.gain.setValueAtTime(volume * variant.toneMix, now + startOffset);
            toneGain.gain.exponentialRampToValueAtTime(0.0001, now + startOffset + duration * 1.2);
            master.gain.value = 0.82;

            noise.connect(filter);
            filter.connect(noiseGain);
            tone.connect(toneGain);
            noiseGain.connect(master);
            toneGain.connect(master);

            if (panner) {
                panner.pan.value = panValue;
                master.connect(panner);
                panner.connect(context.destination);
            } else {
                master.connect(context.destination);
            }

            noise.start(now + startOffset);
            tone.start(now + startOffset);
            noise.stop(now + startOffset + duration);
            tone.stop(now + startOffset + duration * 1.25);

            if (doublePop) {
                playPopcornPop({ mode, intensity: intensity * 0.45, skipThrottle: true });
            }
        }

        function playBoostSuccessSound() {
            const context = ensureAudio();
            if (!context) return;

            const now = context.currentTime;
            [523.25, 659.25, 783.99].forEach((frequency, index) => {
                const tone = context.createOscillator();
                const gain = context.createGain();
                tone.type = 'triangle';
                tone.frequency.setValueAtTime(frequency, now + index * 0.055);
                tone.frequency.exponentialRampToValueAtTime(frequency * 1.18, now + index * 0.055 + 0.16);
                gain.gain.setValueAtTime(0.0001, now + index * 0.055);
                gain.gain.exponentialRampToValueAtTime(0.055, now + index * 0.055 + 0.018);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.055 + 0.2);
                tone.connect(gain);
                gain.connect(context.destination);
                tone.start(now + index * 0.055);
                tone.stop(now + index * 0.055 + 0.22);
            });
        }
        
        function autoChooseWinner() {
            const colorCounts = countLetterColors();
            const namedScores = [];

            // Players without a typed name are called "Player 1", "Player 2", ... like the input placeholder
            getActiveColors().forEach((color, index) => {
                if (colorCounts[color] > 0) {
                    const typedName = (playerNames[color] || '').trim();
                    namedScores.push({ color, score: colorCounts[color], name: typedName || `Player ${index + 1}` });
                }
            });

            if (namedScores.length === 0) {
                gameEnded = true;
                resetBoostState();
                enableStartButton();
                renderPlayerList();
                return;
            }
            
            const highScore = Math.max(...namedScores.map(player => player.score));
            const leaders = namedScores.filter(player => player.score === highScore);

            if (leaders.length > 1) {
                gameEnded = true;
                resetBoostState();
                startTieBattle(leaders, highScore);
                return;
            }

            const winner = leaders[0];
            const winningColor = winner.color;
            const winnerName = winner.name;
            const letterCount = winner.score;
            
            showWinner(winnerName, `${letterCount} letter${letterCount !== 1 ? 's' : ''} conquered`, winningColor);
            gameEnded = true;
            resetBoostState();
            enableStartButton();
        }

        function startTieBattle(leaders, highScore) {
            stopTieBattle();
            ensureAudio();
            resetBtn.disabled = true;
            startBtn.disabled = true;
            tieBattleOverlay.classList.add('visible');
            tieBattleOverlay.setAttribute('aria-hidden', 'false');
            tieBattleNames.innerHTML = '';

            leaders.forEach(leader => {
                const chip = document.createElement('span');
                chip.className = 'tie-battle-chip';
                chip.style.setProperty('--chip-color', leader.color);
                chip.textContent = leader.name || playerNames[leader.color];
                tieBattleNames.appendChild(chip);
            });

            const width = tieBattleCanvas.width;
            const height = tieBattleCanvas.height;
            const pegs = createTieBattlePegs(width, height);

            tieBattleState = {
                highScore,
                pegs,
                frame: 0,
                finishFrame: null,
                balls: leaders.map((leader, index) => {
                    const name = leader.name || playerNames[leader.color] || `Player ${index + 1}`;
                    const seed = deterministicHash(`${leader.color}:${name}:${highScore}:${index}`);
                    const laneWidth = width / (leaders.length + 1);
                    return {
                        ...leader,
                        name,
                        x: laneWidth * (index + 1) + ((seed % 17) - 8) * 0.45,
                        y: 34,
                        vx: ((seed % 9) - 4) * 0.035,
                        vy: 0,
                        radius: 11,
                        finishedAt: null
                    };
                })
            };

            tieBattleFrameId = requestAnimationFrame(runTieBattle);
        }

        function stopTieBattle() {
            if (tieBattleFrameId !== null) {
                cancelAnimationFrame(tieBattleFrameId);
                tieBattleFrameId = null;
            }

            tieBattleState = null;
            tieBattleOverlay.classList.remove('visible');
            tieBattleOverlay.setAttribute('aria-hidden', 'true');
            tieBattleNames.innerHTML = '';
        }

        function deterministicHash(value) {
            let hash = 2166136261;
            for (let i = 0; i < value.length; i++) {
                hash ^= value.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            return hash >>> 0;
        }

        function createTieBattlePegs(width, height) {
            const pegs = [];
            const rows = 7;
            const cols = 9;
            const xGap = width / (cols + 1);
            const yStart = 82;
            const yGap = 38;

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const offset = row % 2 === 0 ? 0 : xGap / 2;
                    const x = xGap * (col + 1) + offset;
                    if (x > width - 36) continue;
                    pegs.push({ x, y: yStart + row * yGap, radius: 7 });
                }
            }

            return pegs;
        }

        function runTieBattle() {
            if (!tieBattleState) return;

            tieBattleState.frame++;
            updateTieBattle();
            drawTieBattle();

            const finishedBalls = tieBattleState.balls.filter(ball => ball.finishedAt !== null);
            if (finishedBalls.length > 0 && tieBattleState.finishFrame === null) {
                tieBattleState.finishFrame = tieBattleState.frame;
            }

            if (
                tieBattleState.finishFrame !== null &&
                tieBattleState.frame - tieBattleState.finishFrame > 55
            ) {
                finishTieBattle();
                return;
            }

            tieBattleFrameId = requestAnimationFrame(runTieBattle);
        }

        function updateTieBattle() {
            const width = tieBattleCanvas.width;
            const height = tieBattleCanvas.height;

            tieBattleState.balls.forEach(ball => {
                if (ball.finishedAt !== null) return;

                ball.vy += 0.18;
                ball.x += ball.vx;
                ball.y += ball.vy;

                if (ball.x - ball.radius < 16) {
                    ball.x = 16 + ball.radius;
                    ball.vx = Math.abs(ball.vx) * 0.72;
                }

                if (ball.x + ball.radius > width - 16) {
                    ball.x = width - 16 - ball.radius;
                    ball.vx = -Math.abs(ball.vx) * 0.72;
                }

                tieBattleState.pegs.forEach(peg => {
                    const dx = ball.x - peg.x;
                    const dy = ball.y - peg.y;
                    const minDistance = ball.radius + peg.radius;
                    const distanceSquared = dx * dx + dy * dy;

                    if (distanceSquared >= minDistance * minDistance || distanceSquared === 0) return;

                    const distance = Math.sqrt(distanceSquared);
                    const nx = dx / distance;
                    const ny = dy / distance;
                    const overlap = minDistance - distance;
                    const impact = ball.vx * nx + ball.vy * ny;

                    ball.x += nx * overlap;
                    ball.y += ny * overlap;

                    if (impact < 0) {
                        ball.vx -= (1.58 * impact) * nx;
                        ball.vy -= (1.58 * impact) * ny;
                    }

                    playPopcornPop({ mode: 'battle', intensity: 0.75 });
                    ball.vx += nx * 0.06;
                    ball.vy += ny * 0.025;
                });

                ball.vx *= 0.993;
                ball.vy *= 0.995;

                if (ball.y + ball.radius >= height - 24) {
                    ball.y = height - 24 - ball.radius;
                    ball.finishedAt = tieBattleState.frame;
                    playPopcornPop({ mode: 'battle', intensity: 1.15 });
                }
            });
        }

        function drawTieBattle() {
            const width = tieBattleCanvas.width;
            const height = tieBattleCanvas.height;

            tieBattleCtx.clearRect(0, 0, width, height);
            tieBattleCtx.fillStyle = '#020202';
            tieBattleCtx.fillRect(0, 0, width, height);

            tieBattleCtx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            tieBattleCtx.lineWidth = 3;
            tieBattleCtx.beginPath();
            tieBattleCtx.moveTo(16, 24);
            tieBattleCtx.lineTo(16, height - 24);
            tieBattleCtx.lineTo(width - 16, height - 24);
            tieBattleCtx.lineTo(width - 16, 24);
            tieBattleCtx.stroke();

            tieBattleState.pegs.forEach(peg => {
                tieBattleCtx.fillStyle = 'rgba(255, 255, 255, 0.82)';
                tieBattleCtx.shadowColor = 'white';
                tieBattleCtx.shadowBlur = 8;
                tieBattleCtx.beginPath();
                tieBattleCtx.arc(peg.x, peg.y, peg.radius, 0, Math.PI * 2);
                tieBattleCtx.fill();
            });

            tieBattleCtx.shadowBlur = 0;
            tieBattleCtx.fillStyle = 'rgba(255, 255, 255, 0.88)';
            tieBattleCtx.font = '700 18px Arial, sans-serif';
            tieBattleCtx.textAlign = 'center';
            tieBattleCtx.fillText('First ball down wins the tie', width / 2, height - 42);

            tieBattleState.balls.forEach(ball => {
                tieBattleCtx.shadowColor = ball.color;
                tieBattleCtx.shadowBlur = 18;
                tieBattleCtx.fillStyle = ball.color;
                tieBattleCtx.beginPath();
                tieBattleCtx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                tieBattleCtx.fill();

                tieBattleCtx.shadowBlur = 0;
                tieBattleCtx.fillStyle = 'white';
                tieBattleCtx.font = '700 12px Arial, sans-serif';
                tieBattleCtx.fillText(ball.name.slice(0, 8), ball.x, Math.max(18, ball.y - 18));
            });
        }

        function finishTieBattle() {
            const winner = [...tieBattleState.balls]
                .sort((a, b) => (
                    (a.finishedAt ?? Infinity) - (b.finishedAt ?? Infinity) ||
                    b.y - a.y ||
                    deterministicHash(`${a.color}:${a.name}`) - deterministicHash(`${b.color}:${b.name}`)
                ))[0];

            const letterCount = winner.score;
            stopTieBattle();
            showWinner(winner.name, `${letterCount} letter${letterCount !== 1 ? 's' : ''} conquered`, winner.color);
            enableStartButton();
        }

        function enableStartButton() {
            startBtn.textContent = 'Start';
            startBtn.disabled = false;
            startBtn.style.opacity = '1';
            startBtn.style.cursor = 'pointer';
            resetBtn.disabled = false;
        }
        
        // In a narrow (portrait) screen the settled pile is taller than 10 ball heights,
        // so the finale zone grows with the total ball area spread over the width.
        let finaleExtraZone = 0;

        function checkGameEnd(timestamp) {
            if (!gameStarted || gameEnded || balls.length < getMaxBalls()) return;

            finaleExtraZone = usesStackedPile()
                ? 1.3 * balls.reduce((sum, ball) => sum + Math.PI * ball.radius * ball.radius, 0) / canvas.width
                : 0;

            const allBallsInBottomZone = balls.every(ball => ball.isWithinFinaleBottomZone());
            if (!allBallsInBottomZone) {
                finaleStartTime = null;
                return;
            }

            if (finaleStartTime === null) finaleStartTime = timestamp;
            if (timestamp - finaleStartTime >= FINALE_SETTLE_MS) autoChooseWinner();
        }
        
        function showWinner(name, scoreText, color) {
            const overlay = document.getElementById('winnerOverlay');
            const winnerName = document.getElementById('winnerName');
            const winnerScore = document.getElementById('winnerScore');
            const wasVisible = overlay.classList.contains('visible');

            winnerName.textContent = name;
            winnerScore.textContent = scoreText;
            overlay.style.setProperty('--winner-color', color);
            overlay.classList.add('visible');
            overlay.setAttribute('aria-hidden', 'false');
            launchWinnerConfetti();
            if (!wasVisible) incrementTotalPlays();
        }
        
        function hideWinner() {
            const overlay = document.getElementById('winnerOverlay');
            overlay.classList.remove('visible');
            overlay.setAttribute('aria-hidden', 'true');
            document.getElementById('winnerConfetti').innerHTML = '';
        }

        function launchWinnerConfetti() {
            const confetti = document.getElementById('winnerConfetti');
            const sourceBalls = balls.length ? balls : getActiveColors().map(color => ({ color, radius: 8 }));
            const fragment = document.createDocumentFragment();
            confetti.innerHTML = '';

            for (let i = 0; i < 140; i++) {
                const source = sourceBalls[Math.floor(Math.random() * sourceBalls.length)];
                const particle = document.createElement('span');
                particle.className = 'confetti-ball';
                particle.style.setProperty('--x', `${Math.random() * 100}%`);
                particle.style.setProperty('--size', `${Math.max(5, Math.min(18, source.radius))}px`);
                particle.style.setProperty('--color', source.color);
                particle.style.setProperty('--drift', `${(Math.random() - 0.5) * 260}px`);
                particle.style.setProperty('--duration', `${2.6 + Math.random() * 2.8}s`);
                particle.style.setProperty('--delay', `${-Math.random() * 5}s`);
                fragment.appendChild(particle);
            }
            confetti.appendChild(fragment);
        }
        
        function updateTitleColor() {
            const titleElement = document.getElementById('title');
            const text = "Just Bouncy Balls";
            let coloredText = '';
            
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const color = letterColors[i] || defaultLetterColor;
                
                if (char === ' ') {
                    coloredText += ' ';
                } else {
                    coloredText += `<span data-i="${i}" style="color: ${color}; text-shadow: 0 0 20px ${color}, 0 0 40px ${color}, 0 0 60px ${color};">${char}</span>`;
                }
            }
            
            titleElement.innerHTML = coloredText;
            updateScores();
        }

        function colorTitleLetter(index, color) {
            if (letterColors[index] === color) return false;

            letterColors[index] = color;
            updateTitleColor();
            return true;
        }
        
        function updateBallCount() {
            ballCountElement.textContent = balls.length;
            checkFinaleBlastCue();
            updateFinaleSwoosh();
        }

        function getSupabaseHeaders() {
            return {
                apikey: SUPABASE_ANON_KEY,
                Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
                'Content-Type': 'application/json'
            };
        }

        function showTotalPlays(value) {
            if (!totalPlaysElement) return;

            totalPlaysElement.textContent = Number.isFinite(value) ? value.toLocaleString('en-US') : '...';
        }

        async function fetchTotalPlays() {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/site_stats?key=eq.total_plays&select=value`, {
                headers: getSupabaseHeaders()
            });

            if (!response.ok) throw new Error(`Could not fetch total plays: ${response.status}`);

            const rows = await response.json();
            return Number(rows?.[0]?.value ?? 0);
        }

        async function updateTotalPlaysDisplay() {
            try {
                showTotalPlays(await fetchTotalPlays());
            } catch (error) {
                console.warn(error);
            }
        }

        async function incrementTotalPlays() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/increment_total_plays`, {
                    method: 'POST',
                    headers: getSupabaseHeaders(),
                    body: '{}'
                });

                if (!response.ok) throw new Error(`Could not increment total plays: ${response.status}`);

                const newTotal = Number(await response.json());
                if (Number.isFinite(newTotal)) {
                    showTotalPlays(newTotal);
                } else {
                    updateTotalPlaysDisplay();
                }
            } catch (error) {
                console.warn(error);
                updateTotalPlaysDisplay();
            }
        }
        
        // Spatial partitioning: uniform grid whose cells fit the largest ball, kept in
        // flat typed arrays (linked lists per cell) so there are no per-frame allocations.
        let gridHead = new Int32Array(0);
        let gridNext = new Int32Array(0);

        function collidePair(ball1, ball2) {
            if (ball1.hasCollided || ball2.hasCollided) return;

            const dx = ball2.x - ball1.x;
            const dy = ball2.y - ball1.y;
            const distanceSquared = dx * dx + dy * dy;
            const minDistance = ball1.radius + ball2.radius;

            if (distanceSquared < minDistance * minDistance && distanceSquared > 0) {
                const distance = Math.sqrt(distanceSquared);
                
                // Markeer beide ballen als gebotst
                ball1.hasCollided = true;
                ball2.hasCollided = true;
                
                // Simplified collision response for performance
                const angle = Math.atan2(dy, dx);
                const sin = Math.sin(angle);
                const cos = Math.cos(angle);
                
                // Roteer snelheden
                const vx1 = ball1.vx * cos + ball1.vy * sin;
                const vy1 = ball1.vy * cos - ball1.vx * sin;
                const vx2 = ball2.vx * cos + ball2.vy * sin;
                const vy2 = ball2.vy * cos - ball2.vx * sin;
                
                // Elastische botsing
                const finalVx1 = ((ball1.radius - ball2.radius) * vx1 + 2 * ball2.radius * vx2) / (ball1.radius + ball2.radius);
                const finalVx2 = ((ball2.radius - ball1.radius) * vx2 + 2 * ball1.radius * vx1) / (ball1.radius + ball2.radius);
                
                const restitution = bounceFactor(cachedMobile ? 0.9 : 0.96);
                ball1.vx = (finalVx1 * cos - vy1 * sin) * restitution;
                ball1.vy = (vy1 * cos + finalVx1 * sin) * restitution;
                ball2.vx = (finalVx2 * cos - vy2 * sin) * restitution;
                ball2.vy = (vy2 * cos + finalVx2 * sin) * restitution;

                // Add a small sideways impulse to energetic desktop impacts.
                if (!cachedMobile && gameStarted && balls.length < getMaxBalls() && Math.abs(vx1 - vx2) > 1.5) {
                    const kick = (Math.random() - 0.5) * 0.25;
                    ball1.vx -= sin * kick;
                    ball1.vy += cos * kick;
                    ball2.vx += sin * kick;
                    ball2.vy -= cos * kick;
                }
                
                // Push balls apart
                const overlap = minDistance - distance;
                const separationX = (dx / distance) * overlap * 0.5;
                const separationY = (dy / distance) * overlap * 0.5;
                
                ball1.x -= separationX;
                ball1.y -= separationY;
                ball2.x += separationX;
                ball2.y += separationY;
                
                // Shrink balls
                ball1.shrink();
                ball2.shrink();
                
                // Spawn new ball on every collision during the game
                if (gameStarted && balls.length < getRegularBallLimit()) {
                    const newX = Math.random() * (canvas.width - 100) + 50;
                    const newY = Math.random() * (canvas.height - 100) + 50;
                    // Random color for fair chances
                    const activeColors = getActiveColors();
                    const randomColor = activeColors[Math.floor(Math.random() * activeColors.length)];
                    const newBall = new Ball(newX, newY, Math.random() * 8 + 4, randomColor);
                    balls.push(newBall);
                    updateBallCount();
                }
                
                // Simplified visual effect
                ball1.glowIntensity = 1.5;
                ball2.glowIntensity = 1.5;

                // Track whether the separation push above actually works.
                // If two balls keep overlapping frame after frame instead of
                // bouncing apart, they've effectively glued together - rare, but funny.
                trackStickyPair(ball1, ball2);
            }
        }

        // Only balls after `index` in the cell, so every pair is handled once
        // Phones: after the normal collisions, push overlapping balls apart (positions only, no
        // shrinking/spawning) so the settled balls stack into a heap instead of one overlapping line.
        function usesStackedPile() {
            return cachedMobile || document.body.classList.contains('portrait-layout');
        }

        const PILE_RELAX_ITERATIONS = 2;

        function relaxOverlaps(count, cols, rows, cellSize) {
            for (let i = 0; i < count; i++) {
                const a = balls[i];
                if (a.isDragging) continue;

                const cx = Math.min(cols - 1, Math.max(0, (a.x / cellSize) | 0));
                const cy = Math.min(rows - 1, Math.max(0, (a.y / cellSize) | 0));

                for (let ny = Math.max(0, cy - 1); ny <= Math.min(rows - 1, cy + 1); ny++) {
                    for (let nx = Math.max(0, cx - 1); nx <= Math.min(cols - 1, cx + 1); nx++) {
                        for (let j = gridHead[ny * cols + nx]; j !== -1; j = gridNext[j]) {
                            if (j <= i) continue;

                            const b = balls[j];
                            if (b.isDragging) continue;

                            const dx = b.x - a.x;
                            const dy = b.y - a.y;
                            const minDistance = a.radius + b.radius;
                            const distanceSquared = dx * dx + dy * dy;
                            if (distanceSquared >= minDistance * minDistance || distanceSquared === 0) continue;

                            const distance = Math.sqrt(distanceSquared);
                            const normalX = dx / distance;
                            const normalY = dy / distance;
                            const push = (minDistance - distance) * 0.5;

                            a.x -= normalX * push;
                            a.y -= normalY * push;
                            b.x += normalX * push;
                            b.y += normalY * push;

                            // Resting contact: cancel the speed towards each other so the heap stays calm
                            const approach = (b.vx - a.vx) * normalX + (b.vy - a.vy) * normalY;
                            if (approach < 0) {
                                a.vx += normalX * approach * 0.5;
                                a.vy += normalY * approach * 0.5;
                                b.vx -= normalX * approach * 0.5;
                                b.vy -= normalY * approach * 0.5;
                            }

                            a.x = Math.max(a.radius, Math.min(canvas.width - a.radius, a.x));
                            a.y = Math.max(a.radius, Math.min(canvas.height - a.radius, a.y));
                            b.x = Math.max(b.radius, Math.min(canvas.width - b.radius, b.x));
                            b.y = Math.max(b.radius, Math.min(canvas.height - b.radius, b.y));
                        }
                    }
                }
            }
        }

        function collideWithCell(ball, index, cell) {
            for (let j = gridHead[cell]; j !== -1; j = gridNext[j]) {
                if (j > index) collidePair(ball, balls[j]);
            }
        }

        function checkCollisions() {
            collisionFrameCounter++;

            const count = balls.length;
            let maxRadius = 0;
            for (let i = 0; i < count; i++) {
                if (balls[i].radius > maxRadius) maxRadius = balls[i].radius;
            }

            const cellSize = Math.max(8, maxRadius * 2);
            const cols = Math.floor(canvas.width / cellSize) + 1;
            const rows = Math.floor(canvas.height / cellSize) + 1;
            const cellCount = cols * rows;

            if (gridHead.length < cellCount) gridHead = new Int32Array(cellCount);
            if (gridNext.length < count) gridNext = new Int32Array(count * 2);
            gridHead.fill(-1, 0, cellCount);

            for (let i = 0; i < count; i++) {
                const ball = balls[i];
                const cx = Math.min(cols - 1, Math.max(0, (ball.x / cellSize) | 0));
                const cy = Math.min(rows - 1, Math.max(0, (ball.y / cellSize) | 0));
                const cell = cy * cols + cx;
                gridNext[i] = gridHead[cell];
                gridHead[cell] = i;
            }

            // Balls are processed in array order (like before) so the pile doesn't get
            // swept in one spatial direction; the grid only narrows down the neighbours.
            for (let i = 0; i < count; i++) {
                const ball = balls[i];
                const cx = Math.min(cols - 1, Math.max(0, (ball.x / cellSize) | 0));
                const cy = Math.min(rows - 1, Math.max(0, (ball.y / cellSize) | 0));

                for (let ny = Math.max(0, cy - 1); ny <= Math.min(rows - 1, cy + 1); ny++) {
                    for (let nx = Math.max(0, cx - 1); nx <= Math.min(cols - 1, cx + 1); nx++) {
                        collideWithCell(ball, i, ny * cols + nx);
                    }
                }
            }

            if (usesStackedPile()) {
                for (let k = 0; k < PILE_RELAX_ITERATIONS; k++) {
                    relaxOverlaps(count, cols, rows, cellSize);
                }
            }

            if (collisionFrameCounter % STICKY_CLEANUP_INTERVAL === 0) {
                cleanupStuckPairs();
            }

            if (activeStickyPairKey) {
                const entry = stuckPairs.get(activeStickyPairKey);
                if (!entry || performance.now() - entry.lastSeen > STICKY_STALE_MS) {
                    hideStickyNotification();
                }
            }
        }

        function trackStickyPair(ball1, ball2) {
            const now = performance.now();
            const pairKey = ball1.id < ball2.id ? `${ball1.id}_${ball2.id}` : `${ball2.id}_${ball1.id}`;
            const existing = stuckPairs.get(pairKey);

            if (existing && now - existing.lastSeen <= STICKY_STALE_MS) {
                existing.lastSeen = now;
                existing.ball1 = ball1;
                existing.ball2 = ball2;
            } else {
                stuckPairs.set(pairKey, { startTime: now, lastSeen: now, ball1, ball2 });
            }

            const entry = stuckPairs.get(pairKey);
            const stuckDuration = now - entry.startTime;
            const aboveLetters = isAboveTitleLetters(ball1, ball2);

            if (!cachedMobile && stuckDuration >= DESKTOP_STUCK_ESCAPE_MS) {
                const midX = (ball1.x + ball2.x) / 2;
                const midY = (ball1.y + ball2.y) / 2;
                const betweenLetters = titleZone && midX >= titleZone.left && midX <= titleZone.right &&
                    midY >= titleZone.top && midY <= titleZone.bottom;
                if (aboveLetters || betweenLetters) {
                    const direction = ball1.x <= ball2.x ? 1 : -1;
                    ball1.vx = -direction * Math.max(5, Math.abs(ball1.vx));
                    ball2.vx = direction * Math.max(5, Math.abs(ball2.vx));
                    ball1.vy = -Math.max(7, Math.abs(ball1.vy));
                    ball2.vy = -Math.max(7, Math.abs(ball2.vy));
                    if (betweenLetters) {
                        ball1.y = titleZone.top - ball1.radius - 3;
                        ball2.y = titleZone.top - ball2.radius - 3;
                    }
                    stuckPairs.delete(pairKey);
                    if (activeStickyPairKey === pairKey) hideStickyNotification();
                    return;
                }
            }

            // Full-strength callout, but only for the rarest case: a pair glued
            // together while hovering right above the title letters.
            if (stuckDuration >= STICKY_DURATION_THRESHOLD_MS && aboveLetters) {
                showStickyNotification(ball1, ball2, pairKey);
            } else if (activeStickyPairKey === pairKey) {
                if (aboveLetters) {
                    updateStickyNotificationPosition(ball1, ball2);
                } else {
                    hideStickyNotification();
                }
            }
        }

        function cleanupStuckPairs() {
            const now = performance.now();
            stuckPairs.forEach((entry, key) => {
                if (now - entry.lastSeen > STICKY_STALE_MS * 3) {
                    stuckPairs.delete(key);
                    if (activeStickyPairKey === key) hideStickyNotification();
                }
            });
        }

        function showStickyNotification(ball1, ball2, pairKey) {
            if (activeStickyPairKey === pairKey) {
                updateStickyNotificationPosition(ball1, ball2);
                return;
            }

            activeStickyPairKey = pairKey;
            if (stickyHideTimer) {
                clearTimeout(stickyHideTimer);
                stickyHideTimer = null;
            }

            updateStickyNotificationPosition(ball1, ball2);
            stickyNotificationEl.classList.remove('fade-out');
            stickyNotificationEl.classList.add('visible', 'flying-in');
        }

        function updateStickyNotificationPosition(ball1, ball2) {
            const midX = (ball1.x + ball2.x) / 2;
            const midY = (ball1.y + ball2.y) / 2;
            const offsetAbove = Math.max(ball1.radius, ball2.radius) + 50;

            const clampedX = Math.max(90, Math.min(canvas.width - 90, midX));
            const clampedY = Math.max(50, midY - offsetAbove);

            stickyNotificationEl.style.setProperty('--notif-x', `${clampedX}px`);
            stickyNotificationEl.style.setProperty('--notif-y', `${clampedY}px`);
        }

        function hideStickyNotification() {
            if (!activeStickyPairKey) return;
            activeStickyPairKey = null;

            stickyNotificationEl.classList.remove('flying-in');
            stickyNotificationEl.classList.add('fade-out');
            stickyHideTimer = setTimeout(() => {
                stickyNotificationEl.classList.remove('visible', 'fade-out');
            }, 2000);
        }

        // Mouse events
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
            
            // Find the clicked ball from top to bottom
            for (let i = balls.length - 1; i >= 0; i--) {
                if (balls[i].isPointInside(mouseX, mouseY)) {
                    draggedBall = balls[i];
                    draggedBall.isDragging = true;
                    draggedBall.dragOffsetX = mouseX - draggedBall.x;
                    draggedBall.dragOffsetY = mouseY - draggedBall.y;
                    lastMouseX = mouseX;
                    lastMouseY = mouseY;
                    break;
                }
            }
        });
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
            
            if (draggedBall) {
                draggedBall.x = mouseX - draggedBall.dragOffsetX;
                draggedBall.y = mouseY - draggedBall.dragOffsetY;
                
                // Binnen canvas grenzen houden
                draggedBall.x = Math.max(draggedBall.radius, Math.min(canvas.width - draggedBall.radius, draggedBall.x));
                draggedBall.y = Math.max(draggedBall.radius, Math.min(canvas.height - draggedBall.radius, draggedBall.y));
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            if (draggedBall) {
                // Snelheid geven gebaseerd op muisbeweging
                draggedBall.vx = (mouseX - lastMouseX) * 0.15;
                draggedBall.vy = (mouseY - lastMouseY) * 0.15;
                draggedBall.isDragging = false;
                draggedBall = null;
            }
        });
        
        // Touch events voor mobiel
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            mouseX = touch.clientX - rect.left;
            mouseY = touch.clientY - rect.top;
            
            for (let i = balls.length - 1; i >= 0; i--) {
                if (balls[i].isPointInside(mouseX, mouseY)) {
                    draggedBall = balls[i];
                    draggedBall.isDragging = true;
                    draggedBall.dragOffsetX = mouseX - draggedBall.x;
                    draggedBall.dragOffsetY = mouseY - draggedBall.y;
                    lastMouseX = mouseX;
                    lastMouseY = mouseY;
                    break;
                }
            }
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (draggedBall) {
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                mouseX = touch.clientX - rect.left;
                mouseY = touch.clientY - rect.top;
                
                draggedBall.x = mouseX - draggedBall.dragOffsetX;
                draggedBall.y = mouseY - draggedBall.dragOffsetY;
                
                draggedBall.x = Math.max(draggedBall.radius, Math.min(canvas.width - draggedBall.radius, draggedBall.x));
                draggedBall.y = Math.max(draggedBall.radius, Math.min(canvas.height - draggedBall.radius, draggedBall.y));
            }
        });
        
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (draggedBall) {
                draggedBall.vx = (mouseX - lastMouseX) * 0.15;
                draggedBall.vy = (mouseY - lastMouseY) * 0.15;
                draggedBall.isDragging = false;
                draggedBall = null;
            }
        });
        
        // Button events
        backgroundMusic.addEventListener('ended', playNextBackgroundTrack);
        backgroundMusic.addEventListener('canplay', startBackgroundMusic, { once: true });
        window.addEventListener('pointerdown', startBackgroundMusic, { once: true });
        window.addEventListener('keydown', startBackgroundMusic, { once: true });
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && !musicStarted) startBackgroundMusic();
        });
        prevTrackBtn.addEventListener('click', playPreviousBackgroundTrack);
        nextTrackBtn.addEventListener('click', playNextBackgroundTrack);
        startBtn.addEventListener('click', startGame);
        resetBtn.addEventListener('click', resetGame);
        winnerResetBtn.addEventListener('click', resetGame);
        addPlayerBtn.addEventListener('click', addPlayer);
        removePlayerBtn.addEventListener('click', removePlayer);
        
        // Many balls: plain solid circles, one path and one fill per colour
        const ballDrawGroups = new Map();

        // Batches keep the array (spawn) order so overlapping balls still show a mix of colours,
        // instead of the last colour drawn covering the whole pile.
        const DRAW_BATCH_SIZE = 32;

        function drawBallsSimple() {
            for (let start = 0; start < balls.length; start += DRAW_BATCH_SIZE) {
                const end = Math.min(start + DRAW_BATCH_SIZE, balls.length);

                ballDrawGroups.forEach(group => { group.length = 0; });

                for (let i = start; i < end; i++) {
                    const ball = balls[i];
                    let group = ballDrawGroups.get(ball.color);
                    if (!group) {
                        group = [];
                        ballDrawGroups.set(ball.color, group);
                    }
                    group.push(ball);
                }

                ballDrawGroups.forEach((group, color) => {
                    if (group.length === 0) return;

                    ctx.fillStyle = color;
                    ctx.beginPath();
                    for (const ball of group) {
                        ctx.moveTo(ball.x + ball.radius, ball.y);
                        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                    }
                    ctx.fill();
                });
            }
        }

        function kickBallOutOfTitleGap(ball, gap, force = 1) {
            if (!titleZone || ball.isDragging) return;
            const direction = ball.x < gap.center ? -1 : 1;
            const touchedLetter = direction < 0 ? gap.leftIndex : gap.rightIndex;
            colorTitleLetter(touchedLetter, ball.color);
            playPopcornPop();
            ball.x = gap.center + direction * Math.max(ball.radius + 4, (gap.right - gap.left) / 2 + 5);
            ball.y = titleZone.top - ball.radius - 5;
            ball.vx = direction * Math.max(4.8 * force, Math.abs(ball.vx) + 2);
            ball.vy = -Math.max(6.5 * force, Math.abs(ball.vy) + 2.5);
            ball.titleGapDwell = 0;
            ball.titleGapFrame = collisionFrameCounter;
        }

        function resolveDesktopTitleGaps() {
            if (cachedMobile || !titleZone || desktopTitleGaps.length === 0) return;
            for (const gap of desktopTitleGaps) {
                let occupant = null;
                for (const ball of balls) {
                    if (ball.x <= gap.repelLeft || ball.x >= gap.repelRight ||
                        ball.y <= titleZone.top - DESKTOP_TITLE_GAP_REPEL_Y ||
                        ball.y >= titleZone.bottom + DESKTOP_TITLE_GAP_REPEL_Y) continue;

                    if (!ball.isDragging) {
                        kickBallOutOfTitleGap(ball, gap, gap.isWordGap ? 1.1 : 1);
                        continue;
                    }

                    if (!occupant) {
                        occupant = ball;
                        continue;
                    }

                    // Keep the dragged ball if there is one; launch every extra ball clear.
                    const extra = ball.isDragging ? occupant : ball;
                    if (ball.isDragging) occupant = ball;
                    kickBallOutOfTitleGap(extra, gap, gap.isWordGap ? 1.15 : 1);
                }
            }
        }

        // Game loop
        function animate(timestamp) {
            // Resize/rotate events can arrive late or get lost on phones, so also check every frame
            const blocked = isLandscapeBlocked();
            if (blocked !== document.body.classList.contains('landscape-blocked') ||
                (!blocked && (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight))) {
                refreshLayout();
            }

            if (blocked) {
                // Paused while turned sideways; the overlay tells the player to rotate back
                requestAnimationFrame(animate);
                return;
            }

            // Canvas leegmaken met zwarte achtergrond
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw balls
            updateDesktopTitleMotion();
            balls.forEach(ball => ball.update());
            resolveDesktopTitleGaps();
            if (balls.length > (cachedMobile ? MOBILE_SIMPLE_DRAW_BALLS : 500)) {
                drawBallsSimple();
            } else {
                balls.forEach(ball => ball.draw());
            }

            // Botsingen controleren
            checkCollisions();
            
            // Check if game should end
            checkGameEnd(timestamp);
            
            requestAnimationFrame(animate);
        }
        
        // Start the game
        updateTitleColor(); // Initialize title colors
        measureTitleLetters();
        renderPlayerList();
        initGame();
        updateTotalPlaysDisplay();
        chooseRandomInitialTrack();
        updateMusicTitle();
        primeBackgroundMusic();
        animate();
    </script>
